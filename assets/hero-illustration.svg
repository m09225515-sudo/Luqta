
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EEE8FF"/>
      <stop offset="1" stop-color="#D7C8FF"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E1FF"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A98AFF"/>
      <stop offset="1" stop-color="#6542C7"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B99AFF"/>
      <stop offset="1" stop-color="#7046D2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#453078" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Soft background -->
  <circle cx="355" cy="295" r="225" fill="url(#bg)" opacity=".8"/>
  <circle cx="355" cy="295" r="180" fill="#FFFFFF" opacity=".28"/>
  <circle cx="130" cy="105" r="7" fill="#A78BFA"/>
  <circle cx="600" cy="125" r="9" fill="#A78BFA"/>
  <circle cx="660" cy="390" r="6" fill="#B89AFF"/>

  <!-- Decorative orbit -->
  <path d="M85 320C95 120 290 45 490 100S700 300 635 465"
        fill="none" stroke="#B59BFA" stroke-width="2"
        stroke-dasharray="5 12" opacity=".7"/>

  <!-- Campus building -->
  <g filter="url(#shadow)">
    <path d="M55 265L285 130L515 265V445H55Z"
          fill="url(#building)" stroke="#BCA8ED" stroke-width="5"/>
    <path d="M40 270L285 122L530 270"
          fill="#FFFFFF" stroke="#8C6BDB" stroke-width="12"
          stroke-linejoin="round"/>

    <path d="M85 285H485V445H85Z" fill="#E7DEFF"/>

    <!-- Windows -->
    <g fill="#55477E">
      <rect x="112" y="310" width="75" height="105" rx="5"/>
      <rect x="202" y="310" width="75" height="105" rx="5"/>
      <rect x="293" y="310" width="75" height="105" rx="5"/>
      <rect x="383" y="310" width="75" height="105" rx="5"/>
    </g>
    <g stroke="#D8C9FF" stroke-width="5">
      <path d="M149 310V415M112 362H187"/>
      <path d="M239 310V415M202 362H277"/>
      <path d="M330 310V415M293 362H368"/>
      <path d="M420 310V415M383 362H458"/>
    </g>

    <!-- Entrance -->
    <rect x="240" y="365" width="90" height="80" rx="8" fill="#A58AE3"/>
    <rect x="250" y="375" width="70" height="70" rx="5" fill="#55477E"/>
    <circle cx="308" cy="410" r="4" fill="#F5D78B"/>

    <!-- Building sign -->
    <rect x="207" y="190" width="156" height="48" rx="12" fill="#FFFFFF"/>
    <text x="285" y="210" text-anchor="middle"
          font-size="13" font-weight="bold" fill="#45356F">جامعة مصراتة</text>
    <text x="285" y="228" text-anchor="middle"
          font-size="11" fill="#7554CC">كلية تقنية المعلومات</text>

    <path d="M35 445H535L515 463H55Z" fill="#9A7BD9"/>
    <path d="M55 463H515" stroke="#FFFFFF" stroke-width="5"/>
  </g>

  <!-- Small trees -->
  <g>
    <path d="M70 425V355M510 425V350" stroke="#7658BD" stroke-width="12" stroke-linecap="round"/>
    <circle cx="70" cy="340" r="35" fill="#8E79D4"/>
    <circle cx="45" cy="365" r="22" fill="#A995E8"/>
    <circle cx="95" cy="365" r="23" fill="#A995E8"/>
    <circle cx="510" cy="337" r="30" fill="#8E79D4"/>
    <circle cx="490" cy="360" r="19" fill="#B49EEB"/>
    <circle cx="532" cy="360" r="20" fill="#B49EEB"/>
  </g>

  <!-- Backpack -->
  <g filter="url(#shadow)">
    <path d="M535 255C535 205 565 180 610 180S685 205 685 255V405
             Q685 440 650 440H570Q535 440 535 405Z"
          fill="url(#bag)" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M572 205C572 145 648 145 648 205"
          fill="none" stroke="#8C68D7" stroke-width="17" stroke-linecap="round"/>
    <path d="M555 285Q610 255 665 285V365Q665 395 635 395H585Q555 395 555 365Z"
          fill="#7952CE" stroke="#D8C8FF" stroke-width="5"/>
    <path d="M590 320H630" stroke="#E8DFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M542 275Q520 320 542 375M678 275Q700 320 678 375"
          fill="none" stroke="#B99AFF" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Books -->
  <g filter="url(#shadow)">
    <path d="M525 440H690L715 463H550Z" fill="#F3CB73"/>
    <path d="M550 463H715V482H550Z" fill="#FFFFFF"/>
    <path d="M535 482H690L710 505H555Z" fill="#9B79E0"/>
    <path d="M555 505H710V522H555Z" fill="#F6F0FF"/>
  </g>

  <!-- Student card -->
  <g transform="rotate(9 685 380)" filter="url(#shadow)">
    <rect x="655" y="345" width="85" height="112" rx="13"
          fill="#FFFFFF" stroke="#B99AFF" stroke-width="5"/>
    <circle cx="697" cy="377" r="16" fill="#9B7BE1"/>
    <path d="M673 421Q697 391 721 421" fill="#9B7BE1"/>
    <path d="M676 436H718" stroke="#D9C9F7" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Floating smart search card -->
  <g filter="url(#shadow)">
    <rect x="35" y="75" width="185" height="76" rx="17" fill="#FFFFFF"/>
    <circle cx="75" cy="113" r="19" fill="#EEE8FF"/>
    <circle cx="72" cy="110" r="9" fill="none" stroke="#7554D5" stroke-width="4"/>
    <path d="M80 118L89 127" stroke="#7554D5" stroke-width="4" stroke-linecap="round"/>
    <text x="160" y="108" text-anchor="middle" font-size="12" fill="#554477">بحث ذكي</text>
    <text x="160" y="129" text-anchor="middle" font-size="10" fill="#9279D5">اعثر على مفقودك</text>
  </g>

  <!-- Floating sparkle -->
  <path d="M605 75L616 102L643 113L616 124L605 151L594 124L567 113L594 102Z"
        fill="#A98AFF"/>
  <circle cx="680" cy="170" r="7" fill="#D0B8FF"/>
  <circle cx="40" cy="200" r="6" fill="#B99AFF"/>
</svg>
